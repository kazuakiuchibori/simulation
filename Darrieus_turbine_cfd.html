            // ─── カラーバー描画（色境界＝目盛り） ────────────────────────────
            if (viewMode !== 'meshOnly') {
                // velocity カラーバー: 絶対速度 0.5刻み、アンカー補間離散
                const vmax = TSR + 1;
                const cbAnchors = [
                    [0.0,  0,   0,   255],
                    [1.0,  255, 255, 255],
                    [2.0,  255, 0,   0  ],
                    [vmax, 255, 255, 0  ],
                ];
                function cbAnchorColor(x) {
                    let lo = cbAnchors[0], hi = cbAnchors[cbAnchors.length - 1];
                    for (let i = 0; i < cbAnchors.length - 1; i++) {
                        if (x >= cbAnchors[i][0] && x <= cbAnchors[i+1][0]) {
                            lo = cbAnchors[i]; hi = cbAnchors[i+1]; break;
                        }
                    }
                    const span = hi[0] - lo[0];
                    const t = span > 0 ? (x - lo[0]) / span : 0;
                    return [
                        Math.round(lo[1] + t * (hi[1] - lo[1])),
                        Math.round(lo[2] + t * (hi[2] - lo[2])),
                        Math.round(lo[3] + t * (hi[3] - lo[3])),
                    ];
                }
                const velSteps = [];
                for (let v = 0; v < vmax - 1e-9; v += 0.5) {
                    const vFrom = v;
                    const vTo   = Math.min(v + 0.5, vmax);
                    const mid   = Math.min(vFrom + 0.25, vmax);
                    const [rv, gv, bv] = cbAnchorColor(mid);
                    velSteps.push({
                        from: vFrom / vmax, to: vTo / vmax,
                        fromV: vFrom, toV: vTo,
                        r: rv, g: gv, b: bv
                    });
                }
                const bands = viewMode === 'velocity' ? velSteps
                    : viewMode === 'pressure' ? [
                        { from: 0.0000, to: 0.0909, r: 200, g: 0, b: 200, fromV: -2.00, toV: -1.75 },
                        { from: 0.0909, to: 0.1818, r: 110, g: 0, b: 220, fromV: -1.75, toV: -1.50 },
                        { from: 0.1818, to: 0.2727, r: 0, g: 60, b: 240, fromV: -1.50, toV: -1.25 },
                        { from: 0.2727, to: 0.3636, r: 0, g: 140, b: 255, fromV: -1.25, toV: -1.00 },
                        { from: 0.3636, to: 0.4545, r: 0, g: 210, b: 255, fromV: -1.00, toV: -0.75 },
                        { from: 0.4545, to: 0.5455, r: 0, g: 200, b: 150, fromV: -0.75, toV: -0.50 },
                        { from: 0.5455, to: 0.6364, r: 0, g: 160, b: 70, fromV: -0.50, toV: -0.25 },
                        { from: 0.6364, to: 0.7273, r: 130, g: 200, b: 60, fromV: -0.25, toV: 0.00 },
                        { from: 0.7273, to: 0.8182, r: 200, g: 200, b: 30, fromV: 0.00, toV: 0.25 },
                        { from: 0.8182, to: 0.9091, r: 240, g: 120, b: 20, fromV: 0.25, toV: 0.50 },
                        { from: 0.9091, to: 1.0000, r: 240, g: 10, b: 10, fromV: 0.50, toV: 0.75 },
                    ]
                        : /* vorticity */[
                            { from: 0.000, to: 0.100, r: 100, g: 0, b: 200 },
                            { from: 0.100, to: 0.250, r: 0, g: 100, b: 255 },
                            { from: 0.250, to: 0.450, r: 0, g: 220, b: 255 },
                            { from: 0.450, to: 0.550, r: 127, g: 127, b: 127 },
                            { from: 0.550, to: 0.750, r: 240, g: 230, b: 0 },
                            { from: 0.750, to: 0.900, r: 255, g: 110, b: 0 },
                            { from: 0.900, to: 1.000, r: 255, g: 0, b: 0 },
                        ].map(b => ({ ...b, fromV: -50 + b.from * 100, toV: -50 + b.to * 100 }));

                const label = viewMode === 'velocity' ? '|u|' : viewMode === 'pressure' ? 'p' : 'ω';
                const cbH = Math.floor((canvas.height - 48) / 2);
                const cbW = 16;
                const cbX = 38;
                const cbY = canvas.height - cbH - 28;

                ctx.save();

                bands.forEach(b => {
                    const y0 = cbY + (1 - b.to) * cbH;
                    const y1 = cbY + (1 - b.from) * cbH;
                    ctx.fillStyle = `rgb(${b.r},${b.g},${b.b})`;
                    ctx.fillRect(cbX, y0, cbW, y1 - y0 + 0.5);
                });

                ctx.strokeStyle = 'rgba(60,60,60,0.5)';
                ctx.lineWidth = 0.8;
                ctx.strokeRect(cbX, cbY, cbW, cbH);

                ctx.font = 'bold 11px "Helvetica Neue", Arial, sans-serif';
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.fillText(label, cbX + cbW / 2, cbY - 7);

                ctx.font = '10px "Helvetica Neue", Arial, sans-serif';
                ctx.textAlign = 'left';
                const drawn = new Set();
                bands.forEach(b => {
                    [b.from, b.to].forEach((norm, ki) => {
                        const val = ki === 0 ? b.fromV : b.toV;
                        const key = norm.toFixed(6);
                        if (drawn.has(key)) return;
                        drawn.add(key);
                        const py = cbY + (1 - norm) * cbH;
                        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                        ctx.lineWidth = 0.8;
                        ctx.beginPath(); ctx.moveTo(cbX, py); ctx.lineTo(cbX + cbW, py); ctx.stroke();
                        ctx.strokeStyle = 'rgba(60,60,60,0.6)';
                        ctx.lineWidth = 0.8;
                        ctx.beginPath(); ctx.moveTo(cbX + cbW, py); ctx.lineTo(cbX + cbW + 4, py); ctx.stroke();
                        const lbl = parseFloat(val.toPrecision(3)).toString();
                        ctx.fillStyle = '#222';
                        ctx.fillText(lbl, cbX + cbW + 6, py + 3.5);
                    });
                });

                ctx.restore();
            }
            // ─────────────────────────────────────────────────────────────────

            // ─── 枠メモリ（目盛り）描画 ───────────────────────────────────────
            {
                const W = canvas.width;
                const H = canvas.height;
                const tickLen = 6;
                const minorTickLen = 3;
                const tickColor = 'rgba(80, 80, 80, 0.85)';
                const labelColor = '#333333';

                const xMin = -offsetX / scale;
                const xMax = (W - offsetX) / scale;
                const yMax = offsetY / scale;
                const yMin = (offsetY - H) / scale;

                function niceStep(range, maxTicks) {
                    if (!isFinite(range) || range <= 0) return 1;
                    const raw = range / maxTicks;
                    if (!isFinite(raw) || raw <= 0) return 1;
                    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
                    const norm = raw / mag;
                    let step;
                    if (norm < 1.5) step = 1.0;
                    else if (norm < 3.5) step = 2.0;
                    else if (norm < 7.5) step = 5.0;
                    else step = 10.0;
                    return step * mag;
                }

                const majorStep = niceStep(xMax - xMin, 8);
                const minorDiv = 5;
                const minorStep = majorStep / minorDiv;

                // 目盛り数が多すぎる場合はスキップ（ズームアウト限界対策）
                const maxTicks = 500;
                if ((xMax - xMin) / minorStep > maxTicks || (yMax - yMin) / (niceStep(yMax - yMin, 5) / minorDiv) > maxTicks) {
                    ctx.restore && ctx.restore();
                    return;
                }

                function fmtTick(v, step) {
                    if (Math.abs(v) < step * 1e-9) return '0';
                    const decimals = Math.max(0, -Math.floor(Math.log10(step)) + 1);
                    const s = v.toFixed(Math.min(decimals, 6));
                    // 小数点がある場合のみ末尾ゼロを除去（整数部のゼロは除去しない）
                    return s.includes('.') ? s.replace(/\.?0+$/, '') : s;
                }

                ctx.save();
                ctx.font = '10px "Helvetica Neue", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';

                // ── 上辺・下辺（X軸） ──
                const xStart = Math.ceil(xMin / minorStep) * minorStep;
                let xIdx = 0;
                for (let x = xStart; x <= xMax + minorStep * 0.5; x += minorStep, xIdx++) {
                    const px = Math.round(offsetX + x * scale);
                    if (px < 0 || px > W) continue;
                    const isMajor = (Math.round(xStart / minorStep) + xIdx) % minorDiv === 0;
                    const tLen = isMajor ? tickLen : minorTickLen;

                    ctx.strokeStyle = tickColor;
                    ctx.lineWidth = isMajor ? 1.2 : 0.7;
                    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, tLen); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(px, H); ctx.lineTo(px, H - tLen); ctx.stroke();

                    if (isMajor) {
                        const label = fmtTick(x, majorStep);
                        ctx.fillStyle = labelColor;
                        ctx.textBaseline = 'top';
                        ctx.fillText(label, px, tickLen + 2);
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(label, px, H - tickLen - 2);
                        ctx.textBaseline = 'top';
                    }
                }

                // ── 左辺・右辺（Y軸） ──
                const yStep = niceStep(yMax - yMin, 5);
                const yMinorStep = yStep / minorDiv;
                const yStart = Math.ceil(yMin / yMinorStep) * yMinorStep;
                ctx.textBaseline = 'middle';
                let yIdx = 0;
                for (let y = yStart; y <= yMax + yMinorStep * 0.5; y += yMinorStep, yIdx++) {
                    const py = Math.round(offsetY - y * scale);
                    if (py < 0 || py > H) continue;
                    const isMajor = (Math.round(yStart / yMinorStep) + yIdx) % minorDiv === 0;
                    const tLen = isMajor ? tickLen : minorTickLen;

                    ctx.strokeStyle = tickColor;
                    ctx.lineWidth = isMajor ? 1.2 : 0.7;
                    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(tLen, py); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(W, py); ctx.lineTo(W - tLen, py); ctx.stroke();

                    if (isMajor) {
                        const label = fmtTick(y, yStep);
                        ctx.fillStyle = labelColor;
                        ctx.textAlign = 'left';
                        ctx.fillText(label, tLen + 3, py);
                        ctx.textAlign = 'right';
                        ctx.fillText(label, W - tLen - 3, py);
                        ctx.textAlign = 'left';
                    }
                }
                ctx.restore();
            }
            // ─────────────────────────────────────────────────────────────────
        }

        function updateAndRender() {
            updateCfdParamsFromUi();
            generateInitialAlgebraicGrid();
            smoothGridElliptic();
            initCfdBuffers();
            renderGrid();
        }

        viewModeSelect.addEventListener('change', renderGrid);

        // Reが変更された際、初期化とグリッド再生成を行う
        reInput.addEventListener('change', () => {
            clampInputValue(reInput);
            updateAndRender();
        });
        reInput.addEventListener('input', () => {
            const validRe = parseInt(reInput.value);
            if (isNaN(validRe) || validRe < 1000 || validRe > 1000000) return;
            updateAndRender();
        });

        // TSRが変更された際、初期化とグリッド再生成を行う
        tsrInput.addEventListener('input', () => {
            const v = parseFloat(tsrInput.value);
            if (isNaN(v) || v < 2 || v > 8) return;
            updateAndRender();
        });
        tsrInput.addEventListener('change', () => {
            let v = parseFloat(tsrInput.value);
            if (isNaN(v)) v = 4.0;
            tsrInput.value = Math.max(2, Math.min(8, v));
            updateAndRender();
        });

        // 厚み選択のリスナー（selectのため change イベントのみ）
        nacaThicknessSelect.addEventListener('change', () => {
            updateAndRender();
        });

        // ブレード数のリスナー（selectのため change イベントのみ）
        nbladeInput.addEventListener('change', () => {
            updateAndRender();
        });

        // 回転半径のリスナー（selectのため change イベントのみ）
        rRotorInput.addEventListener('change', () => {
            updateAndRender();
        });

        function cfdLoop() {
            if (!isCfdRunning) return;
            for (let step = 0; step < 3; step++) {
                stepFlowSolver();
            }
            renderGrid();
            requestAnimationFrame(cfdLoop);
        }

        toggleCfdBtn.addEventListener('click', () => {
            isCfdRunning = !isCfdRunning;
            if (isCfdRunning) {
                toggleCfdBtn.innerText = "Stop";
                toggleCfdBtn.style.background = "#c0392b";
                cfdLoop();
            } else {
                toggleCfdBtn.innerText = "Start";
                toggleCfdBtn.style.background = "#e67e22";
            }
        });

        resetCfdBtn.addEventListener('click', () => {
            initCfdBuffers();
            renderGrid();
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;

            const physX = (mouseX - offsetX) / scale;
            const physY = (offsetY - mouseY) / scale;
            if (e.deltaY < 0) scale = Math.min(10000, scale * 1.1);
            else scale = Math.max(10, scale / 1.1);
            offsetX = mouseX - physX * scale; offsetY = mouseY + physY * scale;
            renderGrid();
        });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; startY = e.clientY; });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            offsetX += e.clientX - startX; offsetY += e.clientY - startY;
            startX = e.clientX; startY = e.clientY;
            renderGrid();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // 初期実行
        updateAndRender();
    </script>
</body>
</html>
